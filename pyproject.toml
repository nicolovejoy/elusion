[project]
name = "elusion"
version = "0.0.1"
description = "A miniature document-review pipeline over SEC 10-K risk factors, built to learn the MLOps toolchain."
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "datasets",
  "pyarrow",
  "pandas",
  "psycopg[binary]",
  "sqlalchemy",
  "confluent-kafka",
  "prefect>=3",
  "mlflow",
  "scipy",
  "pydantic",
  "typer",
  "python-dotenv",
]

[project.optional-dependencies]
spark = ["pyspark", "delta-spark"]
openai = ["openai"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
elusion = "elusion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elusion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
