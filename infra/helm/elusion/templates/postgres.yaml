# Postgres: documents, scores and the job table, as the compose `postgres` service.
# A StatefulSet rather than a Deployment: it is the Kubernetes object for "one pod with its
# own disk", and its volumeClaimTemplate gives that pod a PersistentVolumeClaim that
# survives pod restarts and `helm uninstall` (delete it by hand when done).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "elusion.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "elusion.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "elusion.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: elusion}
            - {name: POSTGRES_DB, value: elusion}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elusion.secret.postgres" . }}
                  key: POSTGRES_PASSWORD
            # A subdirectory: a fresh cloud disk has lost+found at its root, which initdb
            # refuses to share.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, elusion, -d, elusion]
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
